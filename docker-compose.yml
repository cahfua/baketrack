services:
  postgres:
    image: postgres:16-alpine
    container_name: baketrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: baketrack
      POSTGRES_USER: baketrack
      POSTGRES_PASSWORD: baketrack_dev
    ports:
      - "5432:5432"
    volumes:
      - baketrack_pgdata:/var/lib/postgresql/data

volumes:
  baketrack_pgdata:
